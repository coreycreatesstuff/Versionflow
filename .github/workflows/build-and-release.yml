name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Win-x64 Binaries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pub = "dist/win-x64"
          New-Item -ItemType Directory -Force -Path $pub | Out-Null

          dotnet publish src/VersionFlow.App/VersionFlow.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $pub
          dotnet publish src/VersionFlow.Cli/VersionFlow.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$pub/cli"
          dotnet publish src/VersionFlow.Worker/VersionFlow.Worker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $pub
          Copy-Item assets/branding/VersionFlow.ico "$pub/VersionFlow.ico" -Force
          Copy-Item README.md "$pub/README.md" -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $pub).Path, (Join-Path (Resolve-Path "dist").Path "VersionFlow-win-x64-portable.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)

          $hash = (Get-FileHash "dist/VersionFlow-win-x64-portable.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/SHA256SUMS.txt" -Value "$hash  VersionFlow-win-x64-portable.zip" -Encoding UTF8

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VersionFlow-win-x64
          path: |
            dist/VersionFlow-win-x64-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VersionFlow-win-x64-portable.zip
            dist/SHA256SUMS.txt
